name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check physiopal/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # MediaPipe's native library needs these graphics libs, which GitHub's
      # Ubuntu runners don't ship with (macOS/Windows laptops already have them).
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1
      - run: pip install -e ".[dev]"
      - run: python scripts/download_models.py lite
      - run: pytest tests/ -v
