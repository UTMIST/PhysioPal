[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physiopal"
version = "0.1.0"
description = "Webcam-based physiotherapy exercise coaching with MediaPipe pose estimation"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2,<2",
    "opencv-contrib-python>=4.9",  # same cv2 build mediapipe pulls in; don't add opencv-python
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
# Parked UTMIST ML-seed training template (see ml/). Run from inside ml/.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tensorboard>=2.15",
    "wandb>=0.16",
    "timm>=0.9",
    "ultralytics>=8.1",
]

[tool.setuptools.packages.find]
include = ["physiopal*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
